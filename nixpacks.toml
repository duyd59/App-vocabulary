[variables]
NPM_CONFIG_LEGACY_PEER_DEPS = "true"
NPM_CONFIG_PRODUCTION = "false"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev --legacy-peer-deps --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "NODE_ENV=production npx tsx server.ts"
